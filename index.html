<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday, Tushu 💜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--lav:#fff1c9;--lav2:#ffdf8f;--deep:#8a3b4f;--ink:#4a2a24;--pink:#ffb4a2;--sun:#f4b400;--paper:#fffdf5;--shadow:0 6px 14px rgba(138,59,107,.25)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 85% 0,#ffd75e,transparent 45%),radial-gradient(circle at 8% 100%,#ffc2d1,transparent 40%),radial-gradient(circle at 15% 0,#fff8e1,var(--lav) 65%) fixed;line-height:1.5}
h1,h2{font-weight:600;color:var(--deep);margin:.2em 0}
section{padding:3.5rem 1.2rem;max-width:1100px;margin:auto;text-align:center;position:relative}
section[hidden]{display:none}
.in{animation:rise .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:.7em 1.4em;background:var(--pink);color:var(--ink);font-weight:500;box-shadow:var(--shadow);transition:transform .15s}
button:hover{transform:translateY(-2px) rotate(-1deg)}
:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.sticker{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 5px 6px rgba(138,59,107,.28))}
.tape{position:absolute;width:90px;height:26px;background:rgba(246,199,68,.7);top:-12px;left:50%;margin-left:-45px;transform:rotate(-3deg)}
.paper{background:var(--paper);box-shadow:var(--shadow);position:relative}
.fx{position:absolute;pointer-events:none}
.sway{animation:sway 5s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{50%{transform:rotate(7deg)}}
.sunrow{display:flex;justify-content:center;align-items:center;gap:.6rem;margin:.5rem 0 1rem}
.sunrow svg:nth-child(odd){width:34px;height:34px}.sunrow svg:nth-child(even){width:22px;height:22px;color:var(--pink)}
.gif{display:block;margin:1rem auto;width:min(280px,78%);height:auto;border-radius:18px;border:6px solid #fff;box-shadow:var(--shadow);transform:rotate(-2deg);background:var(--lav2)}
.gif:nth-of-type(even){transform:rotate(2deg)}.gif[hidden]{display:none}
/* 1 welcome */
#welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem}
.main-img{width:min(280px,70vw);aspect-ratio:1;object-fit:cover;border-radius:50% 50% 46% 54%/55% 50% 50% 45%;border:8px solid #fff;box-shadow:var(--shadow);transform:rotate(-3deg);background:var(--lav2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;width:min(420px,100%);margin-top:.5rem}
.opts button{padding:1em;background:#fff}
.opts button.bad{animation:shake .4s;background:#ffe3ee}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#hint{min-height:3em;color:var(--deep);font-weight:500}
.hat{font-size:1.1rem;color:var(--deep)}
/* 2 party */
h1.bday{font-family:Caveat,cursive;font-size:clamp(2.4rem,8vw,4.6rem);line-height:1.1}
.stage{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2rem;margin-top:1.5rem}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.popper{animation:wig 1.2s ease-in-out infinite;transform-origin:10% 90%}
@keyframes wig{50%{transform:rotate(-10deg)}}
.beat{animation:beat 1.2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.25)}}
.kiss{display:flex;align-items:flex-end;justify-content:center}
.kiss svg:first-child{margin-right:-14px;transform:rotate(8deg)}
.kiss svg:nth-child(2){margin-left:-14px;transform:scaleX(-1) rotate(8deg)}
/* 3 gallery */
.rail{display:flex;gap:1.2rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:1.5rem .5rem 1rem;-webkit-overflow-scrolling:touch}
.card{flex:0 0 82%;scroll-snap-align:center;padding:.8rem .8rem 1rem;transform:rotate(var(--r,-2deg));border:0;text-align:center;border-radius:4px;cursor:zoom-in;background:var(--paper);box-shadow:var(--shadow);color:var(--ink)}
.card:nth-child(even){--r:2.2deg}.card:hover{transform:rotate(0) scale(1.02)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--lav2)}
.card span{display:block;margin-top:.6rem;font-family:Caveat,cursive;font-size:1.6rem;line-height:1.1}
@media(min-width:800px){.rail{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;gap:2rem 1.6rem;padding:2rem 0}.card{flex:none}.card:nth-child(3n+2){margin-top:1.5rem}}
.big{font-size:1.2rem;padding:1em 2em;margin-top:2rem;background:var(--deep);color:#fff}
dialog{border:0;border-radius:18px;padding:1.4rem;max-width:min(560px,94vw);background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(40,20,80,.45)}
dialog::backdrop{background:rgba(74,36,64,.6)}
dialog img{max-width:100%;max-height:70vh;display:block;margin:auto}
.x{position:absolute;top:8px;right:8px;width:44px;height:44px;padding:0;background:#fff}
/* 4 quiz */
#qz h2{font-size:1.6rem;margin-top:1rem}
#qz .opts{grid-template-columns:1fr;margin:1rem auto}
#qz .opts button{background:var(--lav)}
#reply{min-height:3em;font-weight:500;color:var(--deep)}
/* 5 note */
#note{max-width:1000px}
#note .paper{padding:clamp(2rem,6vw,4.5rem) clamp(1.4rem,6vw,4rem);min-height:70vh;text-align:left;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(#fffaf6 0,#fffaf6 100%);margin:2rem 0}
#note h2{font-family:Caveat,cursive;font-size:clamp(2.2rem,6vw,3.4rem);text-align:center;margin-bottom:1rem}
#text{font-family:Caveat,cursive;font-weight:500;font-size:clamp(1.65rem,3.6vw,2.3rem);line-height:1.5;color:#3a2d5e}
#text p{margin:0 0 1em}
#text .w{opacity:0;transition:opacity .5s}#text .w.on{opacity:1}
.ctrl{display:flex;gap:.6rem;justify-content:center;margin-top:1rem}
.ctrl button{background:#fff;font-size:.95rem;padding:.5em 1.1em}
.heart{position:absolute;bottom:-30px;animation:float 9s linear infinite;opacity:0;color:var(--pink);pointer-events:none}
@keyframes float{10%{opacity:.8}100%{transform:translateY(-110vh) translateX(30px);opacity:0}}
#note{overflow:hidden}
/* 6 video */
video{width:min(640px,100%);border-radius:18px;border:8px solid #fff;box-shadow:var(--shadow);background:#000;margin-top:1rem}
code{background:#fff;padding:.1em .4em;border-radius:6px}
/* music + calm */
#bar{position:fixed;right:12px;bottom:12px;z-index:9;display:flex;gap:.4rem;align-items:center;background:#fff;border-radius:999px;padding:.3rem .5rem .3rem 1rem;box-shadow:var(--shadow);font-size:.85rem}
#bar button{padding:.4em .8em;background:var(--lav)}
#bar[hidden]{display:none}
#calm{position:fixed;left:12px;bottom:12px;z-index:9;font-size:.85rem;padding:.5em 1em;background:#fff}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
[data-calm] *,[data-calm] *::before{animation:none!important;transition:none!important}
[data-calm]{scroll-behavior:auto}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<!-- ===== Reusable drawings (original, simple, inspired by the cute mood) ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="dudu" viewBox="0 0 100 130"><ellipse cx="50" cy="104" rx="26" ry="24" fill="#c99370" stroke="#5b3a2e" stroke-width="3"/><circle cx="20" cy="30" r="12" fill="#b9825e" stroke="#5b3a2e" stroke-width="3"/><circle cx="80" cy="30" r="12" fill="#b9825e" stroke="#5b3a2e" stroke-width="3"/><ellipse cx="50" cy="62" rx="40" ry="34" fill="#c99370" stroke="#5b3a2e" stroke-width="3"/><ellipse cx="50" cy="70" rx="12" ry="8" fill="#f1d2b5"/><circle cx="34" cy="58" r="4" fill="#3b2a22"/><circle cx="66" cy="58" r="4" fill="#3b2a22"/><circle cx="22" cy="70" r="7" fill="#f2a65a" opacity=".75"/><circle cx="78" cy="70" r="7" fill="#f2a65a" opacity=".75"/><path d="M45 69q5 5 10 0" stroke="#3b2a22" stroke-width="2.5" fill="none" stroke-linecap="round"/></symbol>

<symbol id="gift" viewBox="0 0 60 60"><rect x="6" y="24" width="48" height="32" rx="4" fill="currentColor" stroke="#5b3a2e" stroke-width="2.500"/><rect x="3" y="16" width="54" height="12" rx="4" fill="currentColor" stroke="#5b3a2e" stroke-width="2.500"/><path d="M27 16h6v40h-6z" fill="#fff" opacity=".85"/><path d="M30 16c-8-12-18-4-10 0zM30 16c8-12 18-4 10 0z" fill="none" stroke="#5b3a2e" stroke-width="3"/></symbol>

<canvas id="fx" aria-hidden="true"></canvas>
<button id="calm" type="button" aria-pressed="false">✨ Calm animations</button>
<div id="bar" role="group" aria-label="Music controls" hidden><span id="trk"></span><button id="pp" type="button">Pause</button><button id="mu" type="button" aria-pressed="false">Mute</button></div>

<!-- 1 · WELCOME -->
<section id="welcome" aria-labelledby="q">

<img class="gif" data-gif="party2" alt="">

<!-- 3 · GALLERY -->

/* ================= end of editable area ================= */

const $=s=>document.querySelector(s), calmBtn=$("#calm");
let calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
const setCalm=v=>{calm=v;document.documentElement.toggleAttribute("data-calm",v);calmBtn.setAttribute("aria-pressed",v)};
setCalm(calm); calmBtn.onclick=()=>setCalm(!calm);

const ph=(t,n)=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><rect width='400' height='500' fill='#d6c8f0'/><text x='200' y='240' font-size='70' text-anchor='middle'>💜</text><text x='200' y='310' font-size='24' text-anchor='middle' fill='#4a3a78' font-family='sans-serif'>${t} ${n||""}</text></svg>`);
const img=(el,src,t,n)=>{el.onerror=()=>{el.onerror=null;el.src=ph(t,n)};el.src=src};

const gph=k=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 220'><rect width='300' height='220' fill='#ffe9a8'/><rect x='10' y='10' width='280' height='200' rx='14' fill='none' stroke='#8a3b4f' stroke-width='3' stroke-dasharray='8 8'/><text x='150' y='105' font-size='44' text-anchor='middle'>💗</text><text x='150' y='145' font-size='17' text-anchor='middle' fill='#8a3b4f' font-family='sans-serif'>Your GIF here (${k})</text></svg>`);
document.querySelectorAll("[data-gif]").forEach(el=>{const c=CONFIG.gifs[el.dataset.gif];if(!c||!c.src){el.hidden=true;return}el.alt=c.alt||"";el.onerror=()=>{el.onerror=null;el.src=gph(el.dataset.gif)};el.src=c.src});
/* tear the edges of "paper cutouts" */
function tear(el){const p=[];const j=()=>Math.random()*1.6;
 for(let i=0;i<=20;i++)p.push(`${i*5}% ${j()}%`);for(let i=1;i<=14;i++)p.push(`${100-j()}% ${i*7}%`);
 for(let i=20;i>=0;i--)p.push(`${i*5}% ${100-j()}%`);for(let i=13;i>=1;i--)p.push(`${j()}% ${i*7}%`);
 el.style.clipPath=`polygon(${p.join(",")})`}
tear($("#paper"));

/* ---------- confetti ---------- */
const cv=$("#fx"),cx=cv.getContext("2d");let bits=[],raf;
const size=()=>{cv.width=innerWidth;cv.height=innerHeight};size();addEventListener("resize",size);
function burst(x,y,n=90){if(calm)return;const c=["#b79be6","#f6b3cb","#f6c744","#fff","#d6c8f0"];
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:3+Math.random()*4,c:c[i%5],l:90+Math.random()*50,rot:Math.random()*6})}
 if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);bits=bits.filter(b=>b.l-->0);
 bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.22;b.vx*=.99;b.rot+=.15;cx.save();cx.translate(b.x,b.y);cx.rotate(b.rot);cx.fillStyle=b.c;cx.globalAlpha=Math.min(1,b.l/30);cx.fillRect(-b.r,-b.r/2,b.r*2,b.r);cx.restore()});
 raf=bits.length?requestAnimationFrame(tick):null}

/* ---------- music ---------- */
const tracks=Object.fromEntries(Object.keys(CONFIG.music).map(k=>[k,new Audio(CONFIG.music[k].src)]));
Object.values(tracks).forEach(a=>{a.loop=true;a.preload="none"});
let cur=null;
function play(k){stopAll();cur=k;const a=tracks[k];$("#trk").textContent=CONFIG.music[k].title;$("#bar").hidden=false;$("#pp").textContent="Pause";a.muted=$("#mu").getAttribute("aria-pressed")==="true";a.play().catch(()=>{$("#pp").textContent="Play"})}
function stopAll(){Object.values(tracks).forEach(a=>a.pause());cur=null}
$("#pp").onclick=()=>{if(!cur)return;const a=tracks[cur];if(a.paused){a.play();$("#pp").textContent="Pause"}else{a.pause();$("#pp").textContent="Play"}};
$("#mu").onclick=e=>{const m=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",m);e.target.textContent=m?"Unmute":"Mute";Object.values(tracks).forEach(a=>a.muted=m)};
addEventListener("pointerdown",()=>{if(!cur&&!$("#welcome").hidden&&$("#party").hidden)play("welcome")},{once:true});

/* ---------- reveal ---------- */
function show(id){const s=$(id);s.hidden=false;s.classList.add("in");setTimeout(()=>s.scrollIntoView({behavior:calm?"auto":"smooth",block:"start"}),50)}

/* ---------- 1 welcome ---------- */
img($("#mainImg"),CONFIG.mainImage,"Your photo here");$("#mainImg").alt=CONFIG.mainImageAlt;
$("#q").textContent=CONFIG.question;
let tries=0;
CONFIG.months.forEach(m=>{const b=document.createElement("button");b.type="button";b.textContent=m;
 b.onclick=()=>{ if(m===CONFIG.correct){
   play("party");$("#hint").textContent="Yesss! 🥰";
   show("#party");$("#gallery").hidden=false;$("#gallery").classList.add("in");
   setTimeout(()=>burst(innerWidth/2,innerHeight/3,160),600);
  } else {b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");
   $("#hint").textContent=CONFIG.hints[tries++%CONFIG.hints.length]}};
 $("#months").append(b)});

/* ---------- 2 party ---------- */
$("#hb").textContent=CONFIG.birthdayMessage;
$("#pop").onclick=()=>{const r=$("#popper").getBoundingClientRect();burst(r.left+r.width/2,r.top,110)};

/* ---------- 3 gallery ---------- */
const lb=$("#lb");
CONFIG.gallery.forEach((g,i)=>{const c=document.createElement("button");c.type="button";c.className="card";
 c.setAttribute("aria-label","View larger: "+g.caption);
 c.innerHTML='<img loading="lazy"><span></span>';const im=c.querySelector("img");img(im,g.src,"Photo",i+1);im.alt=g.alt;c.querySelector("span").textContent=g.caption;
 c.onclick=()=>{const o=$("#lbi");img(o,g.src,"Photo",i+1);o.alt=g.alt;$("#lbc").textContent=g.caption;lb.showModal()};$("#rail").append(c)});
$("#lbx").onclick=()=>lb.close();
lb.addEventListener("click",e=>{if(e.target===lb)lb.close()});

/* ---------- 4 quiz ---------- */
const qz=$("#qz");let qi=0;
function ask(){const s=CONFIG.quiz[qi];$("#step").textContent=`Question ${qi+1} of ${CONFIG.quiz.length}`;$("#qh").textContent=s.q;$("#reply").textContent="";$("#qopts").innerHTML="";
 s.a.forEach(o=>{const b=document.createElement("button");b.type="button";b.textContent=o.t;
  b.onclick=()=>{$("#reply").textContent=o.r;if(!o.ok){b.classList.add("bad");return}
   [...$("#qopts").children].forEach(x=>x.disabled=true);burst(innerWidth/2,innerHeight/2,40);
   setTimeout(()=>{qi++;qi<CONFIG.quiz.length?ask():done()},1300)};
  $("#qopts").append(b)});$("#qopts").firstChild.focus()}
function done(){$("#step").textContent="";$("#qh").textContent="🎉 Congratulations!";$("#qopts").innerHTML="";$("#reply").textContent=CONFIG.quizDone;$("#toNote").hidden=false;burst(innerWidth/2,innerHeight/2,150)}
$("#openQ").onclick=()=>{qi=0;$("#toNote").hidden=true;qz.showModal();ask();play("quiz")};
$("#qzx").onclick=()=>qz.close();
$("#toNote").onclick=()=>{qz.close();$("#note").hidden=false;$("#video").hidden=false;$("#note").classList.add("in");
 setTimeout(()=>$("#note").scrollIntoView({behavior:calm?"auto":"smooth"}),50);play("note");write();floatHearts();loadVideo()};

/* ---------- 5 note (words appear one by one) ---------- */
let timer;const T=$("#text");
$("#nh").textContent=CONFIG.noteTitle;
function write(){clearInterval(timer);T.innerHTML="";const words=[];
 CONFIG.note.trim().split(/\n\s*\n/).forEach(par=>{const p=document.createElement("p");
  par.trim().split(/\s+/).forEach((w,i,a)=>{const s=document.createElement("span");s.className="w";s.textContent=w+(i<a.length-1?" ":"");p.append(s);words.push(s)});T.append(p)});
 let i=0;if(calm){words.forEach(w=>w.classList.add("on"));return}
 timer=setInterval(()=>{words[i]?.classList.add("on");if(++i>=words.length)clearInterval(timer)},CONFIG.wordDelayMs)}
$("#skip").onclick=()=>{clearInterval(timer);T.querySelectorAll(".w").forEach(w=>w.classList.add("on"))};
$("#replay").onclick=write;
function floatHearts(){if($("#note .heart"))return;for(let i=0;i<10;i++){const h=document.createElement("span");h.className="heart";h.textContent=i%2?"💗":"🌻";h.setAttribute("aria-hidden","true");
 h.style.cssText=`left:${5+i*9.5}%;font-size:${16+(i%4)*6}px;animation-delay:${i*1.3}s`;$("#note").append(h)}}

/* ---------- 6 video ---------- */
function loadVideo(){const v=$("#vid");v.poster=CONFIG.video.poster;v.src=CONFIG.video.src;v.muted=true;v.play().catch(()=>{});
 v.onerror=()=>{$("#vidmsg").innerHTML="Add your video at <code>"+CONFIG.video.src+"</code>"}}
</script>
</body>
